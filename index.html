<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASQA Responsible AI Principles in VET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Import Inter font for a clean, modern look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        /* Brand Colors: 
           #1f2a52 (Midnight Blue)
           #e72582 (Pink)
           #00bec7 (Teal)
           #d2f0f0 (Light Aqua)
           #abb5bf (Slate Grey)
        */

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            color: #1f2a52;
        }

        .main-container {
            max-width: 1040px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        @media (min-width: 768px) {
            .main-container {
                flex-direction: row;
                align-items: stretch;
            }
        }

        /* Circular Navigation Buttons */
        .nav-column {
            display: flex;
            flex-direction: row;
            gap: 0.85rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        @media (min-width: 768px) {
            .nav-column {
                flex-direction: column;
                overflow-x: visible;
                padding-bottom: 0;
                width: 110px;
                flex-shrink: 0;
            }
        }

        .circle-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #1f2a52; /* Midnight Blue */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(31, 42, 82, 0.15);
            transition: all 0.3s ease;
            flex-shrink: 0;
            border: 3px solid transparent;
        }

        .circle-btn svg.nav-icon {
            width: 26px;
            height: 26px;
            margin-bottom: 3px;
            transition: transform 0.3s ease;
        }

        .circle-btn:hover svg.nav-icon {
            transform: scale(1.12);
        }

        .circle-btn span.label {
            font-size: 0.65rem;
            font-weight: 600;
            margin-top: 1px;
            padding: 0 4px;
            line-height: 1.1;
        }

        .circle-btn:hover {
            background-color: #e72582; /* Pink */
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(231, 37, 130, 0.3);
        }

        .circle-btn.active {
            background-color: #00bec7; /* Teal */
            border-color: #d2f0f0;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 190, 199, 0.4);
        }

        /* Content Card */
        .content-box {
            flex-grow: 1;
            background-color: #ffffff;
            border-radius: 1.5rem;
            padding: 2.25rem;
            box-shadow: 0 15px 35px rgba(31, 42, 82, 0.08);
            border: 2px solid #d2f0f0;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 520px;
        }

        .content-title {
            color: #e72582; /* Pink */
            font-size: 1.65rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.25;
        }

        .content-desc {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .content-meta {
            font-size: 0.85rem;
            color: #abb5bf; /* Slate Grey */
            font-weight: 500;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #d2f0f0;
        }

        .action-buttons-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
        }

        .examples-btn {
            background-color: #00bec7; /* Teal */
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.4rem;
            border-radius: 9999px; /* Pill shape */
            border: none;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .examples-btn:hover {
            background-color: #1f2a52; /* Midnight Blue */
            transform: translateY(-2px);
        }

        .questions-btn {
            background-color: #1f2a52; /* Midnight Blue */
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.4rem;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .questions-btn:hover {
            background-color: #e72582; /* Pink */
            transform: translateY(-2px);
        }
        
        .box-icon-wrapper {
            background-color: #d2f0f0; /* Light Aqua */
            color: #00bec7; /* Teal */
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 10px rgba(0, 190, 199, 0.15);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(31, 42, 82, 0.85); /* Midnight Blue transparent */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 1rem;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #ffffff;
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 680px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.3s ease;
            border: 4px solid #d2f0f0;
            position: relative;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.25rem;
            font-size: 1.75rem;
            color: #abb5bf;
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.2s;
            line-height: 1;
        }

        .close-btn:hover {
            color: #e72582;
        }

        .item-card {
            background-color: #f8fafc;
            border-left: 4px solid #00bec7;
            padding: 1.1rem;
            margin-bottom: 1rem;
            border-radius: 0 0.75rem 0.75rem 0;
            display: flex;
            align-items: flex-start;
            gap: 0.85rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        
        .item-card.question-card {
            border-left-color: #e72582; /* Pink for questions */
        }

        .item-icon {
            color: #00bec7;
            flex-shrink: 0;
            margin-top: 0.15rem;
        }
        
        .item-icon.question-icon {
            color: #e72582;
        }

        .item-title {
            color: #1f2a52;
            display: block;
            margin-bottom: 0.35rem;
            font-size: 1.05rem;
            font-weight: 700;
        }

        /* Custom scrollbar for modal */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }
        .modal-content::-webkit-scrollbar-track {
            background: #f8fafc;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: #abb5bf;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- Left: Circular Navigation -->
        <div class="nav-column" id="nav-container">
            <!-- Buttons injected via JS -->
        </div>

        <!-- Right: Rectangular Content Box -->
        <div class="content-box">
            <div id="box-icon-container" class="box-icon-wrapper">
                <!-- Icon injected here -->
            </div>
            <h1 class="text-xs uppercase tracking-widest text-[#abb5bf] mb-2 font-bold" id="box-kicker">OFFICIAL ASQA GUIDANCE 2026</h1>
            <h2 class="content-title" id="box-title">Principles for the Responsible Use of AI in VET</h2>
            
            <!-- Dynamic Content Area -->
            <div id="box-description" class="content-desc">
                <!-- Text injected here -->
            </div>
            
            <p class="content-meta" id="box-meta"></p>

            <div class="action-buttons-wrapper">
                <button id="btn-examples" class="examples-btn" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                    View RTO Examples
                </button>

                <button id="btn-questions" class="questions-btn" style="display: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    Self-Assurance Questions
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="interactive-modal">
        <div class="modal-content">
            <button class="close-btn" id="btn-close-modal">&times;</button>
            <h3 class="text-2xl font-bold text-[#1f2a52] mb-1" id="modal-title">Details</h3>
            <p class="text-sm text-[#abb5bf] mb-5" id="modal-subtitle">Practical guidance for RTO implementation</p>
            
            <div id="modal-body">
                <!-- Content injected here -->
            </div>
        </div>
    </div>

    <script>
        const principlesData = [
            {
                id: 'start',
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>',
                navLabel: 'Start',
                title: 'Responsible Use of AI in VET',
                description: `
                    <p class="mb-3 text-lg font-semibold text-[#1f2a52]">ASQA’s Principles guide providers towards safe, ethical, and effective AI integration.</p>
                    <p class="mb-4 text-sm text-gray-700 leading-relaxed">The rapid uptake of AI is reshaping aspects of vocational education and training (VET) delivery. These principles do not introduce new regulatory requirements. Instead, they provide a structured way to interpret, implement, and oversee AI use within your existing obligations, including the 2025 Standards for RTOs.</p>
                    
                    <div class="bg-[#d2f0f0]/60 p-4 rounded-xl border-l-4 border-[#00bec7]">
                        <p class="text-sm font-semibold text-[#1f2a52] m-0">👉 Select a principle on the left to explore its requirements, view RTO examples, and access ASQA self-assurance audit questions.</p>
                    </div>
                `,
                meta: 'Guiding quality, compliance and integrity across VET delivery',
                hasExamples: false,
                hasQuestions: false
            },
            {
                id: 'p1',
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>',
                navLabel: 'Principle 1',
                title: 'Principle 1: AI use is supported by strong governance that ensures it does not undermine the quality or integrity of VET.',
                description: `
                    <p class="mb-3 text-sm text-gray-700 leading-relaxed">AI must be used in ways that protect the quality and integrity of VET through strong provider governance, processes and controls that support compliant and reliable practices. Providers’ governance arrangements should ensure that:</p>
                    <ul class="list-disc pl-5 text-sm text-gray-700 space-y-1">
                        <li>AI use is understood, managed and applied in a purposeful way</li>
                        <li>visibility of how AI is used in training and assessment practices is maintained</li>
                        <li>systems for identifying and responding to AI risks are implemented</li>
                        <li>AI adoption is carefully considered and incorporated into organisational processes without undermining the quality or integrity of VET delivery or outcomes.</li>
                    </ul>
                `,
                meta: 'Quality Area 4 - Governance - Standard 4.1 | Compliance Requirements - Clause 9',
                hasExamples: true,
                hasQuestions: true,
                examples: [
                    { title: 'Academic Integrity Checks', text: 'If you suspect a group of students who struggled in face-to-face classes used AI to complete an unsupervised quiz with perfect scores, trigger your academic integrity policy. Use a secondary assessment method, like a verbal interview, to verify the evidence is authentic.' },
                    { title: 'Clear AI Policies', text: 'Develop an Acceptable AI Use policy for both staff and students so everyone knows exactly what tools are approved and where the boundaries lie.' },
                    { title: 'Risk Registers', text: 'Update your RTO risk register to specifically capture risks associated with AI adoption, including algorithmic bias and copyright infringement, detailing your mitigation strategies.' }
                ],
                questions: [
                    { title: 'Responsibility & Accountability', text: 'Which roles will be responsible and accountable for how AI is used and overseen across your organisation? Do these individuals need to be upskilled in order to fulfill their responsibilities?' },
                    { title: 'Policies & Controls', text: 'What policies, frameworks and controls are needed to guide how AI tools and systems are selected, implemented and used across your organisation?' },
                    { title: 'Risk Mitigation', text: 'What risks are associated with your chosen AI tools and systems, and how will they be mitigated/ managed?' },
                    { title: 'Training Integrity', text: 'How will you ensure that your AI use does not compromise the integrity of training and assessment practices, and that outcomes reflect a student’s own skills, knowledge and competencies?' },
                    { title: 'Monitoring & Evaluation', text: 'How and when will you actively monitor and evaluate your AI systems and tools to ensure they operate as intended?' }
                ]
            },
            {
                id: 'p2',
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>',
                navLabel: 'Principle 2',
                title: 'Principle 2: Human oversight and accountability is maintained in all AI supported activities, ensuring that decisions affecting students remain the responsibility of qualified trainers, assessors and staff.',
                description: `
                    <p class="text-sm text-gray-700 leading-relaxed mb-3">Providers must ensure that qualified trainers, assessors and staff retain full responsibility for decisions affecting students and apply active human oversight and professional judgement to all AI supported activities. AI must not replace human decision-making, evaluation or accountability.</p>
                    <p class="text-sm text-gray-700 leading-relaxed">This means AI outputs are considered, reviewed and applied in context, rather than relied on without scrutiny. Staff remain responsible for determining the appropriateness, accuracy and relevance of AI supported processes and outcomes, particularly where decisions may impact student progression, assessment or support. Responsibility for decisions rests with qualified personnel, and the use of AI must not diminish professional accountability.</p>
                `,
                meta: 'Quality Area 1 (Standard 1.4) | Quality Area 3 (Standards 3.2, 3.3) | Quality Area 4 (Standard 4.2)',
                hasExamples: true,
                hasQuestions: true,
                examples: [
                    { title: 'Timestamp Video Evidence', text: 'Use AI to map key actions in a video against a rubric. The assessor must then review the actual footage properly (not just speed through it) to make the final, valid competency call.' },
                    { title: 'Verify Authenticity', text: 'If an AI cheating detector flags a student\'s work as AI-generated, a human assessor must step in. Use verbal questioning to confirm the student\'s knowledge and ensure the evidence is authentic before making an outcome decision.' },
                    { title: 'Validate AI Content', text: 'If using AI to generate a lesson plan or quiz, a qualified trainer must review the material to ensure it is accurate, current, and aligned to the training package before delivering it.' }
                ],
                questions: [
                    { title: 'Staff Understanding', text: 'Do your staff have sufficient understanding of your organisation’s policies on AI use to apply them in their day-to-day role? For example, would your staff recognise when AI outputs are incomplete, inaccurate or not fit-for-purpose?' },
                    { title: 'Verification Responsibility', text: 'Who will be responsible for ensuring that all AI supported outputs are reviewed, tailored and verified before being used in a training or assessment context?' },
                    { title: 'Monitoring Misuse', text: 'How will you know if your staff are misusing AI, for example, relying solely on AI to make decisions such as assessment judgements?' },
                    { title: 'Student Awareness', text: 'How will you make students aware of the AI tools and systems you use in your registered training organisation (RTO)?' }
                ]
            },
            {
                id: 'p3',
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>',
                navLabel: 'Principle 3',
                title: 'Principle 3: AI systems and tools manage information securely and in accordance with existing privacy, data protection and record keeping obligations.',
                description: `
                    <p class="mb-3 text-sm text-gray-700 leading-relaxed">AI must be used lawfully and in accordance with providers’ privacy, security and data-handling obligations. This includes understanding how AI systems and tools collect, use, store and share information, and ensuring that their use does not result in the inappropriate disclosure or misuse of personal or organisational data.</p>
                    <p class="text-sm text-gray-700 leading-relaxed">Where an off-the-shelf AI tool or system is being used, providers remain responsible for undertaking due diligence to ensure student privacy and security is able to be maintained.</p>
                `,
                meta: 'Quality Area 4 - Governance - Standards 4.1 and 4.3 | Compliance Requirements - Clause 20',
                hasExamples: true,
                hasQuestions: true,
                examples: [
                    { title: 'Strip Personal Data (Public AI)', text: 'If using free or public AI tools, remove all identifying student info before analysing feedback or drafting plans. Keep data handling valid and private.' },
                    { title: 'Enterprise Licenses & Privacy Caveats', text: 'While enterprise/educational AI licenses (like Copilot or Gemini) ring-fence your data so it isn\'t used to train public models, Australian Privacy Principles (APPs) still apply.<br><br><span class="font-bold">Data Minimisation:</span> Only process necessary personal info. If grouping survey themes, AI doesn\'t need student names.<br><span class="font-bold">Data Sovereignty:</span> You still need to ensure you know where that enterprise data is stored (onshore vs offshore) and that this aligns with your RTO\'s privacy policy.' },
                    { title: 'Get Clear Consent', text: 'Update enrolment terms to get explicit consent on how third-party cloud tools and AI interact with student data. Keep your processes transparent and fair.' }
                ],
                questions: [
                    { title: 'System Capabilities & Risk', text: 'Does your Student Management System and/or Learner Management System have inbuilt AI capabilities? If so, what are the risks associated with this and how will they be managed? For example, have you considered data sovereignty and if data is stored onshore or offshore?' },
                    { title: 'Staff Understanding of Data Sharing', text: 'Do your staff understand what information can and cannot be shared with AI tools, particularly where personal or sensitive data is involved?' },
                    { title: 'Student Consent', text: 'How will you advise students, and gain their prior written consent, when their personal or sensitive information may be used in, or processed by, an AI-enabled system or software solution?' },
                    { title: 'Record Retention', text: 'If your AI systems create records, how will you ensure they are retained in accordance with record keeping requirements?' }
                ]
            },
            {
                id: 'p4',
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>',
                navLabel: 'Principle 4',
                title: 'Principle 4: AI use supports and enhances student equity, inclusivity, accessibility and wellbeing.',
                description: `
                    <p class="text-sm text-gray-700 leading-relaxed mb-3">Providers must ensure that their AI use is fair and transparent, and does not create barriers to equitable, inclusive and accessible learning experiences. This includes for students with diverse backgrounds, abilities, digital literacy levels and support needs.</p>
                    <p class="text-sm text-gray-700 leading-relaxed">Providers need to consider how different students may experience and engage with AI supported activities, including their access to technology, confidence in using digital tools and ability to participate effectively. AI use should support participation, enhance accessibility and contribute to student wellbeing, rather than create additional complexity.</p>
                `,
                meta: 'Quality Area 2 - VET student support - Standards 2.2 to 2.6',
                hasExamples: true,
                hasQuestions: true,
                examples: [
                    { title: 'Adapt Learning Pathways', text: 'Use AI to simplify complex language in learner guides for students with lower LLN levels, keeping support accessible and flexible.' },
                    { title: 'Live Accessibility Tools', text: 'Provide AI live-captioning and translation during virtual classes to actively support CALD or hearing-impaired learners.' },
                    { title: 'Flexible Assessment Options', text: 'Allow neurodivergent students to use AI speech-to-text tools to demonstrate their knowledge effectively.' }
                ],
                questions: [
                    { title: 'Engagement & Participation', text: 'How might your AI systems and tools affect student engagement and participation, both positively and negatively?' },
                    { title: 'Equitable Access', text: 'How will you ensure equitable access by all students to your AI tools and systems?' },
                    { title: 'Support & Digital Literacy', text: 'What student support can you offer to ensure that AI tools and systems can be used with confidence, especially for those with low digital literacy?' },
                    { title: 'Cohort Appropriateness', text: 'Are your AI systems and tools appropriate for your student cohort? For example, are they capable of considering diverse perspectives and cultural sensitivities?' },
                    { title: 'Academic Integrity Risks', text: 'How will you ensure that AI use does not create reliance on technology or tools, putting academic integrity at risk?' }
                ]
            },
            {
                id: 'p5',
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>',
                navLabel: 'Principle 5',
                title: 'Principle 5: AI use aligns with training product requirements, industry expectations and the needs of the relevant student cohort.',
                description: `
                    <p class="text-sm text-gray-700 leading-relaxed mb-3">AI use must not compromise the requirements of the training product, including the conditions under which competency is to be achieved and demonstrated.</p>
                    <p class="text-sm text-gray-700 leading-relaxed">AI use must be suitable for the student cohort and context, supporting learning and participation without undermining the development and demonstration of required skills and knowledge. All training product requirements must be met where AI is used, regardless of whether AI is explicitly referenced in the training product. AI use should also reflect industry and workplace expectations.</p>
                `,
                meta: 'Quality Area 1 (Standards 1.1, 1.2, 1.3) | Quality Area 2 (Standard 2.2) | 2025 Standards for RTOs',
                hasExamples: true,
                hasQuestions: true,
                examples: [
                    { title: 'Teach Industry-Standard Tools', text: 'Integrate the specific AI tools used in your industry sector so graduates enter the workforce with current, relevant skills.' },
                    { title: 'Dynamic Role-Plays', text: 'Generate realistic, varied workplace scenarios using AI to boost the authenticity of simulation assessments.' },
                    { title: 'Draft Unit Mapping', text: 'Use AI to draft preliminary mapping matrices, ensuring an assessor verifies that all unit requirements are valid and fully satisfied.' }
                ],
                questions: [
                    { title: 'Skill Development', text: 'How will you ensure your use of AI supports, and does not dilute, students’ development of skills and knowledge as required by the training product?' },
                    { title: 'Industry Currency', text: 'How will you keep pace with industry’s adoption of AI in relation to the courses you have on scope? What professional development will your trainers and assessors need to maintain industry currency?' },
                    { title: 'Assessment Suitability', text: 'What existing training and assessment practices need to be maintained or are not suitable to be conducted using AI?' }
                ]
            }
        ];

        const navContainer = document.getElementById('nav-container');
        const boxIconContainer = document.getElementById('box-icon-container');
        const boxTitle = document.getElementById('box-title');
        const boxDescription = document.getElementById('box-description');
        const boxMeta = document.getElementById('box-meta');
        const btnExamples = document.getElementById('btn-examples');
        const btnQuestions = document.getElementById('btn-questions');
        
        const modal = document.getElementById('interactive-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalSubtitle = document.getElementById('modal-subtitle');
        const modalBody = document.getElementById('modal-body');

        let currentActiveData = null;

        // Initialize Navigation
        function initNav() {
            principlesData.forEach((item) => {
                const btn = document.createElement('div');
                btn.className = `circle-btn ${item.id === 'start' ? 'active' : ''}`;
                btn.dataset.id = item.id;
                
                btn.innerHTML = `
                    ${item.iconSvg}
                    <span class="label">${item.navLabel}</span>
                `;
                
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.circle-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    updateContent(item.id);
                });

                navContainer.appendChild(btn);
            });
            
            updateContent('start');
        }

        // Update Information Display
        function updateContent(id) {
            const data = principlesData.find(p => p.id === id);
            currentActiveData = data;

            boxIconContainer.style.opacity = 0;
            boxTitle.style.opacity = 0;
            boxDescription.style.opacity = 0;
            boxMeta.style.opacity = 0;
            
            setTimeout(() => {
                const mainIcon = data.iconSvg.replace('class="nav-icon"', 'width="28" height="28"');
                boxIconContainer.innerHTML = mainIcon;
                
                boxTitle.innerHTML = data.title;
                boxDescription.innerHTML = data.description;
                boxMeta.innerHTML = data.meta;
                
                btnExamples.style.display = data.hasExamples ? 'inline-flex' : 'none';
                btnQuestions.style.display = data.hasQuestions ? 'inline-flex' : 'none';

                boxIconContainer.style.transition = 'opacity 0.25s ease';
                boxTitle.style.transition = 'opacity 0.25s ease';
                boxDescription.style.transition = 'opacity 0.25s ease';
                boxMeta.style.transition = 'opacity 0.25s ease';
                
                boxIconContainer.style.opacity = 1;
                boxTitle.style.opacity = 1;
                boxDescription.style.opacity = 1;
                boxMeta.style.opacity = 1;
            }, 120);
        }

        // Open Modal for Examples
        function openExamplesModal() {
            if(!currentActiveData || !currentActiveData.examples) return;

            modalTitle.textContent = currentActiveData.title + ' — Examples';
            modalSubtitle.textContent = 'Practical application and scenarios in RTO environments';
            
            modalBody.innerHTML = currentActiveData.examples.map(ex => `
                <div class="item-card">
                    <div class="item-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <div>
                        <h4 class="item-title">${ex.title}</h4>
                        <p class="text-sm text-gray-700 leading-relaxed">${ex.text}</p>
                    </div>
                </div>
            `).join('');

            modal.classList.add('show');
        }

        // Open Modal for Self-Assurance Questions
        function openQuestionsModal() {
            if(!currentActiveData || !currentActiveData.questions) return;

            modalTitle.textContent = currentActiveData.title + ' — Self-Assurance';
            modalSubtitle.textContent = 'ASQA audit evaluation & self-assurance questions';
            
            modalBody.innerHTML = currentActiveData.questions.map(q => `
                <div class="item-card question-card">
                    <div class="item-icon question-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    </div>
                    <div>
                        <h4 class="item-title">${q.title}</h4>
                        <p class="text-sm text-gray-700 leading-relaxed">${q.text}</p>
                    </div>
                </div>
            `).join('');

            modal.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
        }

        // Event Listeners
        btnExamples.addEventListener('click', openExamplesModal);
        btnQuestions.addEventListener('click', openQuestionsModal);
        btnCloseModal.addEventListener('click', closeModal);
        
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('DOMContentLoaded', initNav);
    </script>
</body>
</html>
