            flex-shrink: 0;
            border: 3px solid transparent;
            position: relative;
            user-select: none;
        }

            width: 24px;
            height: 24px;
            margin-bottom: 2px;

            font-weight: 600;
            margin-top: 1px;
            padding: 0 4px;
            line-height: 1.1;
        }

            height: 20px;
            border-radius: 50%;
            background-color: #e72582;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            border: 2px solid #ffffff;

    <script>
        const principlesData = [
            {
                id: 'start',
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>',
                navLabel: 'Overview',
                title: 'Responsible Use of Artificial Intelligence (AI) in VET',
                description: `
                    <p class="mb-3 text-base md:text-lg font-semibold text-[#1f2a52]">ASQA’s 5 Principles guide providers towards safe, ethical, and effective AI integration.</p>
                    <p class="mb-4 text-sm text-gray-700 leading-relaxed">Developed following sector-wide consultation, these principles do not introduce new regulatory requirements. Instead, they provide a structured way to interpret, implement, and oversee AI use within your existing obligations under the <strong>2025 Standards for RTOs</strong>.</p>
                    
                    <!-- Official ASQA Distinction: AI vs Automation -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 mb-4">
                        <div class="bg-[#f8fafc] p-3.5 rounded-xl border border-[#d2f0f0]">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="w-2.5 h-2.5 rounded-full bg-[#e72582]"></span>
                                <h4 class="font-bold text-sm text-[#1f2a52]">What is an AI Tool?</h4>
                            </div>
                            <p class="text-xs text-gray-600 leading-relaxed">AI tools <strong>interpret, analyse, and generate</strong> information. They work with complex or ambiguous inputs—for example, giving feedback on student writing, generating lesson materials, or summarising student questions.</p>
                        </div>
                        <div class="bg-[#f8fafc] p-3.5 rounded-xl border border-gray-200">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="w-2.5 h-2.5 rounded-full bg-[#00bec7]"></span>
                                <h4 class="font-bold text-sm text-[#1f2a52]">What is Automation?</h4>
                            </div>
                            <p class="text-xs text-gray-600 leading-relaxed">Automation tools follow <strong>predefined rules</strong> and do the same task the same way every time (e.g., auto-marking multiple-choice questions). There is no interpretation, learning, or decision-making beyond programmed rules.</p>
                        </div>
                    </div>

                    <div class="bg-[#d2f0f0]/60 p-3.5 rounded-xl border-l-4 border-[#00bec7]">
                        <p class="text-xs md:text-sm font-semibold text-[#1f2a52] m-0">👉 Explore the <strong>ASQA Risks & Opportunities</strong> below, or select a Principle or Official Case Study on the left.</p>
                        <div class="mt-2.5 pt-2.5 border-t border-[#00bec7]/25 flex flex-wrap gap-4 text-xs">
                            <a href="https://www.asqa.gov.au/for-providers/guidance-and-resources-providers/artificial-intelligence-ai-use-in-vocational-education-training-vet/responsible-use" target="_blank" rel="noopener noreferrer" class="font-bold text-[#1f2a52] hover:text-[#e72582] underline inline-flex items-center gap-1">
                                Official ASQA Responsible Use of AI Guidelines ↗
                            </a>
                            <a href="https://www.asqa.gov.au/for-providers/guidance-and-resources-providers/artificial-intelligence-ai-use-in-vocational-education-training-vet/artificial-intelligence-ai-case-studies" target="_blank" rel="noopener noreferrer" class="font-bold text-[#1f2a52] hover:text-[#e72582] underline inline-flex items-center gap-1">
                                Official ASQA AI Case Studies ↗
                            </a>
                        </div>
                    </div>
                `,
                meta: 'Framework Context: 2025 Standards for RTOs | Official ASQA Guidance',
                hasRisksOpps: true,
                hasExamples: false,
                hasQuestions: false,
                hasTrends: false,
                risks: [
                    'Data privacy and security breaches',
                    'Algorithmic bias and unfairness',
                    'Digital divide increasing student inequality',
                    'Decreased human interaction & trainer mentorship',
                    'Overdependence on technology',
                    'Implementation and ongoing licensing costs',
                    'Transparency, copyright, and IP issues',
                    'Generic, hallucinated, or inaccurate content',
                    'Academic integrity and authenticity risks',
                    'Risks associated with not engaging with AI technology at all (falling behind industry)'
                ],
                opportunities: [
                    'Creating administrative efficiencies across RTO operations',
                    'Assisting with training and assessment content development',
                    'Enhancing accessibility, inclusivity, and tailored student support',
                    'Reflecting current workplace and industry standards',
                    'Creating immersive and simulated learning experiences',
                    'Enhancing performance-based assessment',
                    'Making online training more engaging in real time',
                    'Tracking student progress and identifying early support needs'
                ]
            },
            {
                id: 'p1',
                iconSvg: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>',
                navLabel: 'Principle 1',
                title: 'Principle 1: AI use is supported by strong governance that ensures it does not undermine the quality or integrity of VET.',
                description: `
                    <p class="mb-3 text-sm text-gray-700 leading-relaxed">AI must be used in ways that protect the quality and integrity of VET through strong provider governance, processes and controls that support compliant and reliable practices. Providers’ governance arrangements should ensure that:</p>
                    <ul class="list-disc pl-5 text-sm text-gray-700 space-y-1.5 mb-4">
                        <li>AI use is understood, managed and applied in a purposeful way</li>
                        <li>visibility of how AI is used in training and assessment practices is maintained</li>
                        <li>systems for identifying and responding to AI risks are implemented</li>
                        <li>AI adoption is carefully considered and incorporated into organisational processes without undermining the quality or integrity of VET delivery or outcomes.</li>
                    </ul>

                            <h4 class="font-bold text-[#1f2a52] text-sm md:text-base">Case Study 1: Ensuring integrity in AI-supported assessment</h4>

                        </div>
                        <p><strong>The Scenario:</strong> A student submitted a written assessment using advanced language and reasoning frameworks not covered in class. An AI detector flagged it. When asked, the student explained they used AI to refine their draft and sentence structure, stating the ideas were their own but admitting uncertainty around permitted AI use.</p>
                        <p><strong>The RTO’s Response:</strong> Because <em>BSBCRT411</em> assesses analysing, evaluating, and justifying thinking processes, written evidence alone was insufficient to verify authenticity. Rather than immediately treating it as misconduct, the assessor asked the student to submit an <strong>identity-verified video response</strong> explaining the workplace problem, how they evaluated options, and justifying their solution.</p>

        // Initialize Navigation
        function initNav() {
            principlesData.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `circle-btn ${item.id === 'start' ? 'active visited' : ''}`;
                btn.dataset.id = item.id;
                btn.dataset.index = index;
                btn.setAttribute('aria-label', item.navLabel);
                
                btn.innerHTML = `
                    <span class="visited-badge" title="Explored">✓</span>
                    ${item.iconSvg}
                    <span class="label">${item.navLabel}</span>
                `;
                
                btn.addEventListener('click', () => {
                    selectSection(index);
                });

                navContainer.appendChild(btn);
            });
            
            updateContent(0);
        }

        function selectSection(index) {
            if (index < 0 || index >= principlesData.length) return;
            currentActiveIndex = index;
            const targetId = principlesData[index].id;
            visitedIds.add(targetId);

            document.querySelectorAll('.circle-btn').forEach((b, idx) => {
                b.classList.toggle('active', idx === index);
                if (visitedIds.has(b.dataset.id)) {
                    b.classList.add('visited');
                }
            });

            progressPill.textContent = `${visitedIds.size} of ${principlesData.length} Explored`;
            updateContent(index);
        }

        // Update Information Display
        function updateContent(index) {
            const data = principlesData[index];

            boxIconContainer.style.opacity = 0;
            boxTitle.style.opacity = 0;
            boxDescription.style.opacity = 0;
            boxMeta.style.opacity = 0;
            
            btnPrev.disabled = index === 0;
            btnNext.disabled = index === principlesData.length - 1;

            setTimeout(() => {
                const mainIcon = data.iconSvg.replace('class="nav-icon"', 'width="26" height="26"');
                boxIconContainer.innerHTML = mainIcon;
                
                boxTitle.innerHTML = data.title;

                <div class="item-card">
                    <div class="item-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <div>
                        <h4 class="item-title">${ex.title}</h4>
                        <p class="text-sm text-gray-700 leading-relaxed">${ex.text}</p>
                    </div>
                </div>
            `).join('');

            modal.classList.add('show');
        }

        // Open Modal for Self-Assurance Questions (with interactive checklist capability)
        function openQuestionsModal() {
            const currentActiveData = principlesData[currentActiveIndex];
            if (!currentActiveData || !currentActiveData.questions) return;

            modalTitle.textContent = currentActiveData.navLabel + ' — Self-Assurance Questions';
            modalSubtitle.textContent = 'Official ASQA self-assurance questions (click any question to check it off during your review)';
            
            renderQuestionsList(currentActiveData);
            modal.classList.add('show');
        }

        function renderQuestionsList(currentActiveData) {
            modalBody.innerHTML = currentActiveData.questions.map((q, idx) => {
                const key = `${currentActiveData.id}-q-${idx}`;
                const isChecked = checkedQuestions.has(key);
                return `
                    <div class="item-card question-card ${isChecked ? 'checked' : ''}" onclick="toggleQuestionCheck('${key}')">
                        <div class="item-icon ${isChecked ? '' : 'question-icon'}">
                            ${isChecked 
                                ? '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00bec7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>'
                                : '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>'
                            }
                        </div>
                        <div class="flex-grow">
                            <div class="flex items-center justify-between">
                                <h4 class="item-title">${q.title}</h4>
                                <span class="text-[11px] font-semibold ${isChecked ? 'text-[#00bec7]' : 'text-gray-400'}">${isChecked ? 'Reviewed ✓' : 'Click to mark'}</span>
                            </div>
                            <p class="text-sm text-gray-700 leading-relaxed">${q.text}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.toggleQuestionCheck = function(key) {
            if (checkedQuestions.has(key)) {
                checkedQuestions.delete(key);
            } else {
                checkedQuestions.add(key);
            }
            renderQuestionsList(principlesData[currentActiveIndex]);
        };

        // Open Modal for ASQA IQ Trends in Applications & Responses
        function openTrendsModal() {
            modalTitle.textContent = 'ASQA IQ: Observed AI Trends';
            modalSubtitle.textContent = 'Key regulatory observations on how providers use AI when interacting with ASQA';

            modalBody.innerHTML = `
                <div class="item-card">
                    <div class="item-icon question-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    </div>
                    <div>
                        <h4 class="item-title">Generic AI-Generated Submissions to ASQA</h4>
                        <p class="text-sm text-gray-700 leading-relaxed">In <em>ASQA IQ</em>, ASQA highlighted an increase in providers using generative AI to draft registration applications, change-of-scope submissions, and responses to non-compliance notices. Submissions that rely on generic, unverified AI outputs often fail to reflect the RTO’s actual operations, specific student cohort, or genuine self-assurance evidence.</p>
                    </div>
                </div>
                <div class="item-card">
                    <div class="item-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <div>
                        <h4 class="item-title">Evidence Must Reflect Real Organisational Practice</h4>
                        <p class="text-sm text-gray-700 leading-relaxed">While AI can assist with structuring or editing policies, CEOs and governing persons remain accountable for ensuring all policies, plans, and regulatory responses submitted to ASQA are tailored, accurate, and backed by genuine operational evidence.</p>
                    </div>
                </div>
                <div class="item-card">
                    <div class="item-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                    <div>
                        <h4 class="item-title">ASQA’s Own AI Transparency Commitment</h4>
                        <p class="text-sm text-gray-700 leading-relaxed">Under ASQA’s <em>AI Transparency Statement</em>, ASQA uses AI internally for workplace productivity (such as document summarisation) and analytics insights, while maintaining strict human oversight on all regulatory decisions.</p>
                    </div>
                </div>
            `;
            modal.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
        }

        // Event Listeners
        btnRisksOpps.addEventListener('click', openRisksOppsModal);
        btnExamples.addEventListener('click', openExamplesModal);
        btnQuestions.addEventListener('click', openQuestionsModal);
        btnAsqaTrends.addEventListener('click', openTrendsModal);
        btnCloseModal.addEventListener('click', closeModal);

        btnPrev.addEventListener('click', () => selectSection(currentActiveIndex - 1));
        btnNext.addEventListener('click', () => selectSection(currentActiveIndex + 1));
        
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('show')) {
                closeModal();
            }
        });

        document.addEventListener('DOMContentLoaded', initNav);
    </script>
</body>
</html>
